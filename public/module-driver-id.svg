<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <rect width="200" height="280" fill="url(#driverBg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#0ECECE" opacity="0.6"/>
  <rect x="20" y="12" width="72" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <rect x="155" y="9" width="34" height="14" rx="3" fill="rgba(34,197,94,0.25)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <circle cx="163" cy="16" r="3" fill="#22C55E"/>
  <text x="169" y="20" font-family="sans-serif" font-size="7" fill="#22C55E">ID'd</text>

  <!-- Driver ID Card -->
  <rect x="16" y="44" width="168" height="96" rx="12" fill="rgba(14,206,206,0.07)" stroke="rgba(14,206,206,0.22)" stroke-width="1"/>
  <rect x="16" y="44" width="168" height="28" rx="12" fill="rgba(14,206,206,0.1)"/>
  <rect x="16" y="58" width="168" height="14" fill="rgba(14,206,206,0.1)"/>

  <!-- Avatar circle -->
  <circle cx="52" cy="98" r="22" fill="rgba(14,206,206,0.1)" stroke="rgba(14,206,206,0.3)" stroke-width="1.5"/>
  <circle cx="52" cy="92" r="10" fill="rgba(14,206,206,0.25)"/>
  <path d="M30 116 Q52 104 74 116" fill="rgba(14,206,206,0.2)"/>

  <!-- Driver info -->
  <text x="84" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)">Rajesh Kumar</text>
  <text x="84" y="94" font-family="sans-serif" font-size="8" fill="rgba(14,206,206,0.7)">ID: DRV-00428</text>
  <rect x="84" y="101" width="52" height="14" rx="3" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <circle cx="92" cy="108" r="3" fill="#22C55E"/>
  <text x="98" y="112" font-family="sans-serif" font-size="7" fill="#22C55E">VERIFIED</text>
  <text x="84" y="130" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.35)">Shift: 06:00 – 14:00</text>

  <!-- Fingerprint scan -->
  <rect x="16" y="152" width="84" height="84" rx="10" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <!-- Fingerprint arcs -->
  <path d="M58 194 Q58 180 58 174" stroke="rgba(14,206,206,0.6)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q46 180 48 168" stroke="rgba(14,206,206,0.5)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q70 180 68 168" stroke="rgba(14,206,206,0.5)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q40 176 44 162" stroke="rgba(14,206,206,0.4)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q76 176 72 162" stroke="rgba(14,206,206,0.4)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q34 172 40 156" stroke="rgba(14,206,206,0.3)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M58 194 Q82 172 76 156" stroke="rgba(14,206,206,0.3)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Scan line -->
  <line x1="26" y1="186" x2="90" y2="186" stroke="rgba(14,206,206,0.5)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="35" y="226" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)" letter-spacing="1">SCANNING…</text>

  <!-- Stats column -->
  <rect x="112" y="152" width="72" height="36" rx="8" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.12)" stroke-width="1"/>
  <text x="124" y="168" font-family="monospace" font-size="16" font-weight="700" fill="#0ECECE">98</text>
  <text x="124" y="180" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.55)">Safety Score</text>

  <rect x="112" y="196" width="72" height="36" rx="8" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.12)" stroke-width="1"/>
  <text x="124" y="212" font-family="monospace" font-size="16" font-weight="700" fill="#22C55E">142</text>
  <text x="124" y="224" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.55)">Trips / Month</text>

  <!-- RFID chip decoration -->
  <rect x="138" y="248" width="32" height="22" rx="4" fill="none" stroke="rgba(14,206,206,0.3)" stroke-width="1"/>
  <line x1="138" y1="254" x2="170" y2="254" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <line x1="138" y1="259" x2="170" y2="259" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <line x1="138" y1="264" x2="170" y2="264" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="20" y="264" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.4)" letter-spacing="1">RFID / iBUTTON</text>

  <defs>
    <linearGradient id="driverBg" x1="0" y1="0" x2="200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
</svg>
