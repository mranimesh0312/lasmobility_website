<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <!-- Header -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#0ECECE" opacity="0.7"/>
  <rect x="20" y="12" width="78" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <rect x="144" y="9" width="44" height="14" rx="3" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="150" y="20" font-family="sans-serif" font-size="7" fill="#22C55E">−18% idle</text>
  <!-- Before/after comparison -->
  <text x="8" y="54" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1">BEFORE OPTIMISATION</text>
  <!-- Old route (dashed red) -->
  <path d="M16 70 Q40 55 65 72 Q85 85 110 68 Q140 52 160 74 Q172 82 188 70" stroke="rgba(239,68,68,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4,3"/>
  <circle cx="16" cy="70" r="4" fill="rgba(239,68,68,0.6)"/>
  <circle cx="65" cy="72" r="3" fill="rgba(239,68,68,0.4)"/>
  <circle cx="110" cy="68" r="3" fill="rgba(239,68,68,0.4)"/>
  <circle cx="160" cy="74" r="3" fill="rgba(239,68,68,0.4)"/>
  <circle cx="188" cy="70" r="4" fill="rgba(239,68,68,0.6)"/>
  <text x="148" y="64" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.7)">148 km</text>

  <text x="8" y="100" font-family="sans-serif" font-size="7" fill="rgba(34,197,94,0.7)" letter-spacing="1">AFTER OPTIMISATION</text>
  <!-- New route (solid teal) -->
  <path d="M16 116 Q55 95 100 108 Q140 120 188 102" stroke="url(#optGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="16" cy="116" r="5" fill="#0ECECE"/>
  <circle cx="60" cy="100" r="4" fill="#22C55E"/>
  <circle cx="110" cy="108" r="4" fill="#22C55E"/>
  <circle cx="155" cy="108" r="4" fill="#22C55E"/>
  <circle cx="188" cy="102" r="5" fill="#0ECECE"/>
  <text x="145" y="96" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.9)">112 km</text>
  <!-- Saving badge -->
  <rect x="72" y="126" width="56" height="18" rx="5" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="82" y="138" font-family="sans-serif" font-size="8" font-weight="700" fill="#22C55E">↓ 24% saved</text>
  <!-- Stop sequence cards -->
  <rect x="8" y="152" width="184" height="40" rx="8" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="16" y="165" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.55)" letter-spacing="1">OPTIMISED STOP SEQUENCE</text>
  <text x="16" y="181" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.75)">Depot → Stop 3 → Stop 1 → Stop 4 → Stop 2 → HQ</text>
  <text x="16" y="191" font-family="sans-serif" font-size="6" fill="rgba(34,197,94,0.6)">AI reordered stops to minimise backtracking</text>
  <!-- Metric cards -->
  <rect x="8" y="200" width="56" height="36" rx="6" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="14" y="213" font-family="sans-serif" font-size="6" fill="rgba(14,206,206,0.55)">Fuel saved</text>
  <text x="14" y="228" font-family="monospace" font-size="12" font-weight="700" fill="#0ECECE">4.2 L</text>

  <rect x="72" y="200" width="56" height="36" rx="6" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="78" y="213" font-family="sans-serif" font-size="6" fill="rgba(34,197,94,0.55)">Time saved</text>
  <text x="78" y="228" font-family="monospace" font-size="12" font-weight="700" fill="#22C55E">38 min</text>

  <rect x="136" y="200" width="56" height="36" rx="6" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="142" y="213" font-family="sans-serif" font-size="6" fill="rgba(14,206,206,0.55)">Distance</text>
  <text x="142" y="228" font-family="monospace" font-size="12" font-weight="700" fill="#0ECECE">−36 km</text>

  <!-- ETA prediction strip -->
  <rect x="8" y="244" width="184" height="28" rx="6" fill="rgba(14,206,206,0.04)" stroke="rgba(14,206,206,0.1)" stroke-width="1"/>
  <text x="16" y="257" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.6)">ETA prediction:</text>
  <text x="94" y="257" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.7)">Stop 1: 10:42  ·  Stop 2: 11:18</text>
  <text x="16" y="268" font-family="sans-serif" font-size="6" fill="rgba(255,255,255,0.25)">AI-driven multi-stop optimisation  ·  Live ETA updates</text>
  <defs>
    <linearGradient id="optGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
</svg>
