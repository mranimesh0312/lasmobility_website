<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <!-- Header -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#0ECECE" opacity="0.7"/>
  <rect x="20" y="12" width="56" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <rect x="148" y="9" width="40" height="14" rx="3" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <circle cx="156" cy="16" r="3" fill="#22C55E"/>
  <text x="162" y="20" font-family="sans-serif" font-size="7" fill="#22C55E">LIVE</text>
  <!-- Map area -->
  <rect x="8" y="40" width="184" height="120" rx="8" fill="rgba(4,9,26,0.7)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <!-- Map road lines -->
  <path d="M20 130 Q60 100 100 110 Q140 120 180 90" stroke="rgba(14,206,206,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M20 90 Q50 80 80 95 Q110 110 140 85 Q160 70 180 72" stroke="rgba(14,206,206,0.18)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M20 110 Q70 140 120 130 Q150 124 180 140" stroke="rgba(34,197,94,0.12)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Active route highlight -->
  <path d="M30 130 Q65 108 100 112 Q130 116 155 96" stroke="url(#routeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vehicle markers -->
  <circle cx="70" cy="106" r="10" fill="rgba(14,206,206,0.18)" stroke="rgba(14,206,206,0.5)" stroke-width="1"/>
  <circle cx="70" cy="106" r="5" fill="#0ECECE"/>
  <text x="78" y="97" font-family="monospace" font-size="7" fill="rgba(248,250,252,0.9)" font-weight="bold">TRK-18</text>

  <circle cx="128" cy="114" r="10" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <circle cx="128" cy="114" r="5" fill="#22C55E"/>
  <text x="136" y="105" font-family="monospace" font-size="7" fill="rgba(248,250,252,0.9)" font-weight="bold">BUS-07</text>

  <circle cx="156" cy="96" r="10" fill="rgba(245,158,11,0.18)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <circle cx="156" cy="96" r="5" fill="#F59E0B"/>
  <text x="132" y="87" font-family="monospace" font-size="7" fill="rgba(248,250,252,0.9)" font-weight="bold">VAN-42</text>
  <!-- Pulse rings -->
  <circle cx="70" cy="106" r="14" fill="none" stroke="rgba(14,206,206,0.2)" stroke-width="1"/>
  <circle cx="70" cy="106" r="18" fill="none" stroke="rgba(14,206,206,0.08)" stroke-width="1"/>
  <!-- Live badge on map -->
  <rect x="12" y="44" width="60" height="16" rx="4" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <circle cx="20" cy="52" r="3" fill="#22C55E"/>
  <text x="26" y="56" font-family="sans-serif" font-size="7" fill="#22C55E">Live · Real-time</text>
  <!-- Vehicle count cards -->
  <rect x="8" y="170" width="56" height="46" rx="8" fill="rgba(14,206,206,0.06)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="20" y="188" font-family="monospace" font-size="18" font-weight="700" fill="#0ECECE">42</text>
  <text x="14" y="208" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.6)">Running</text>

  <rect x="72" y="170" width="56" height="46" rx="8" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="84" y="188" font-family="monospace" font-size="18" font-weight="700" fill="#F59E0B">8</text>
  <text x="78" y="208" font-family="sans-serif" font-size="7" fill="rgba(245,158,11,0.6)">Idle</text>

  <rect x="136" y="170" width="56" height="46" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="148" y="188" font-family="monospace" font-size="18" font-weight="700" fill="#EF4444">3</text>
  <text x="142" y="208" font-family="sans-serif" font-size="7" fill="rgba(239,68,68,0.6)">Stopped</text>
  <!-- Trip info strip -->
  <rect x="8" y="224" width="184" height="46" rx="8" fill="rgba(14,206,206,0.04)" stroke="rgba(14,206,206,0.12)" stroke-width="1"/>
  <text x="16" y="238" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.55)" letter-spacing="1">ACTIVE VEHICLE · TRK-18</text>
  <text x="16" y="252" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.85)">67 km/h  ·  Engine ON  ·  GPS: Strong</text>
  <text x="16" y="264" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)">Last update: 2 seconds ago</text>
  <defs>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="#22D9D9"/>
    </linearGradient>
  </defs>
</svg>
