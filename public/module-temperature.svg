<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <rect width="200" height="280" fill="url(#tempBg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#0ECECE" opacity="0.6"/>
  <rect x="20" y="12" width="60" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <rect x="160" y="9" width="28" height="14" rx="3" fill="rgba(34,197,94,0.25)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <circle cx="167" cy="16" r="3" fill="#22C55E"/>

  <!-- Main temp display card -->
  <rect x="16" y="44" width="168" height="90" rx="12" fill="rgba(14,206,206,0.07)" stroke="rgba(14,206,206,0.2)" stroke-width="1"/>

  <!-- Thermometer icon -->
  <rect x="32" y="58" width="8" height="40" rx="4" fill="rgba(14,206,206,0.15)" stroke="rgba(14,206,206,0.4)" stroke-width="1"/>
  <rect x="33" y="78" width="6" height="20" rx="3" fill="url(#coldGrad)"/>
  <circle cx="36" cy="98" r="7" fill="url(#coldGrad)" opacity="0.9"/>

  <!-- Temperature reading -->
  <text x="56" y="76" font-family="monospace" font-size="28" font-weight="700" fill="url(#cyanGrad)">-2°C</text>
  <text x="56" y="92" font-family="monospace" font-size="9" fill="rgba(14,206,206,0.7)" letter-spacing="2">COLD CHAIN</text>
  <rect x="56" y="98" width="72" height="18" rx="4" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <circle cx="64" cy="107" r="3" fill="#22C55E"/>
  <text x="71" y="111" font-family="sans-serif" font-size="8" fill="#22C55E">WITHIN RANGE</text>

  <!-- Zone cards -->
  <rect x="16" y="146" width="76" height="54" rx="8" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="28" y="165" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.6)" letter-spacing="1">ZONE A</text>
  <text x="28" y="180" font-family="monospace" font-size="16" font-weight="700" fill="#0ECECE">-2°C</text>
  <text x="28" y="193" font-family="sans-serif" font-size="7" fill="rgba(34,197,94,0.8)">● Normal</text>

  <rect x="108" y="146" width="76" height="54" rx="8" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="120" y="165" font-family="sans-serif" font-size="7" fill="rgba(245,158,11,0.7)" letter-spacing="1">ZONE B</text>
  <text x="120" y="180" font-family="monospace" font-size="16" font-weight="700" fill="#F59E0B">+4°C</text>
  <text x="120" y="193" font-family="sans-serif" font-size="7" fill="rgba(245,158,11,0.8)">▲ Warning</text>

  <!-- Chart -->
  <rect x="16" y="212" width="168" height="52" rx="8" fill="rgba(14,206,206,0.04)" stroke="rgba(14,206,206,0.1)" stroke-width="1"/>
  <text x="28" y="226" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)" letter-spacing="1">TEMPERATURE LOG</text>
  <polyline points="28,254 48,248 68,250 88,244 108,246 128,242 148,240 168,244 176,242" stroke="url(#cyanGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="28,254 48,248 68,250 88,244 108,246 128,242 148,240 168,244 176,242" stroke="rgba(14,206,206,0.15)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Snowflake decorations -->
  <text x="170" y="70" font-size="16" fill="rgba(14,206,206,0.2)">❄</text>
  <text x="15" y="138" font-size="10" fill="rgba(14,206,206,0.15)">❄</text>

  <defs>
    <linearGradient id="tempBg" x1="0" y1="0" x2="200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="100%" stop-color="#091828"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="#5DECEC"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DECEC"/>
      <stop offset="100%" stop-color="#0ECECE"/>
    </linearGradient>
  </defs>
</svg>
