<svg width="980" height="220" viewBox="0 0 980 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="las-logo-title">
  <title id="las-logo-title">LAS Mobility</title>
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-8%" y="-20%" width="116%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="#14F0F0"/>
    </linearGradient>
  </defs>
  <g filter="url(#softShadow)">
    <!-- L -->
    <path d="M63 54H92L72 154H156L151 178H45C31 178 22 166 25 151L45 54H63Z" fill="#F8FAFC"/>
    <!-- A -->
    <path d="M130 178L199 71C207 58 218 52 231 52C245 52 254 58 262 72L321 178H282L234 91C232 87 229 85 226 85C223 85 220 87 217 92L163 178H130Z" fill="#F8FAFC"/>
    <!-- S -->
    <path d="M268 178H374C402 178 421 160 426 136C432 108 414 92 383 92H326C316 92 313 86 318 79C321 75 325 73 332 73H445L466 54H334C305 54 286 72 281 97C276 123 293 139 323 139H380C391 139 394 145 389 153C386 158 381 160 373 160H291L268 178Z" fill="#F8FAFC"/>
    <!-- Road swoosh -->
    <path d="M 55 210 Q 140 170 230 150 Q 300 134 380 131" stroke="rgba(255,255,255,0.18)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 40 210 Q 130 165 225 143 Q 298 128 382 124" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Road highlight (teal) -->
    <path d="M 218 158 Q 255 148 292 142" stroke="url(#tealGrad)" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 232 166 Q 260 157 288 152" stroke="#060E1A" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="0"/>
    <!-- Road dashes -->
    <path d="M 60 204 Q 140 168 228 150" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="10 12"/>
    <!-- Divider -->
    <line x1="502" y1="48" x2="502" y2="184" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <!-- MOBILITY text -->
    <text x="530" y="151" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="300" letter-spacing="17">MOBILITY</text>
  </g>
</svg>
