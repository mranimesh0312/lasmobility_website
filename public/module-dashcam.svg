<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <rect width="200" height="280" fill="url(#camBg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#EF4444" opacity="0.9"/>
  <rect x="20" y="12" width="54" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <text x="80" y="20" font-family="sans-serif" font-size="8" fill="rgba(239,68,68,0.9)" letter-spacing="1">● REC</text>
  <rect x="148" y="9" width="40" height="14" rx="3" fill="rgba(14,206,206,0.15)" stroke="rgba(14,206,206,0.3)" stroke-width="1"/>
  <text x="155" y="20" font-family="monospace" font-size="8" fill="rgba(14,206,206,0.8)">LIVE</text>

  <!-- Main camera feed -->
  <rect x="16" y="44" width="168" height="94" rx="10" fill="rgba(4,9,26,0.9)" stroke="rgba(14,206,206,0.25)" stroke-width="1"/>
  <!-- Road perspective lines -->
  <line x1="100" y1="138" x2="40" y2="88" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="100" y1="138" x2="160" y2="88" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="100" y1="138" x2="16" y2="108" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="100" y1="138" x2="184" y2="108" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Road surface -->
  <rect x="16" y="112" width="168" height="26" fill="rgba(20,30,60,0.6)"/>
  <!-- Lane markings -->
  <line x1="100" y1="114" x2="97" y2="138" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Horizon glow -->
  <ellipse cx="100" cy="88" rx="50" ry="8" fill="rgba(14,206,206,0.06)"/>

  <!-- Corner viewfinder marks -->
  <path d="M24 52 L24 58 L30 58" stroke="rgba(14,206,206,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M176 52 L176 58 L170 58" stroke="rgba(14,206,206,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M24 130 L24 124 L30 124" stroke="rgba(14,206,206,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M176 130 L176 124 L170 124" stroke="rgba(14,206,206,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Crosshair center -->
  <circle cx="100" cy="91" r="6" stroke="rgba(14,206,206,0.35)" stroke-width="1" fill="none"/>
  <line x1="94" y1="91" x2="97" y2="91" stroke="rgba(14,206,206,0.5)" stroke-width="1"/>
  <line x1="103" y1="91" x2="106" y2="91" stroke="rgba(14,206,206,0.5)" stroke-width="1"/>
  <line x1="100" y1="85" x2="100" y2="88" stroke="rgba(14,206,206,0.5)" stroke-width="1"/>
  <line x1="100" y1="94" x2="100" y2="97" stroke="rgba(14,206,206,0.5)" stroke-width="1"/>

  <!-- Timestamp overlay -->
  <text x="22" y="128" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.5)">2026-05-09  09:41:22</text>
  <text x="22" y="136" font-family="monospace" font-size="6" fill="rgba(14,206,206,0.6)">CAM-F  28.6°  GPS OK</text>

  <!-- Event clips row -->
  <text x="16" y="158" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)" letter-spacing="1">RECENT EVENTS</text>

  <!-- Clip 1 - Harsh brake -->
  <rect x="16" y="164" width="48" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <rect x="16" y="164" width="48" height="20" rx="6" fill="rgba(10,15,30,0.7)"/>
  <rect x="16" y="177" width="48" height="7" fill="rgba(10,15,30,0.7)"/>
  <text x="28" y="175" font-family="sans-serif" font-size="6" fill="rgba(239,68,68,0.9)">⚠ BRAKE</text>
  <text x="20" y="190" font-family="monospace" font-size="5.5" fill="rgba(255,255,255,0.4)">09:28:14</text>

  <!-- Clip 2 - Overspeeding -->
  <rect x="76" y="164" width="48" height="32" rx="6" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <rect x="76" y="164" width="48" height="20" rx="6" fill="rgba(10,15,30,0.7)"/>
  <rect x="76" y="177" width="48" height="7" fill="rgba(10,15,30,0.7)"/>
  <text x="82" y="175" font-family="sans-serif" font-size="6" fill="rgba(245,158,11,0.9)">▲ SPEED</text>
  <text x="80" y="190" font-family="monospace" font-size="5.5" fill="rgba(255,255,255,0.4)">08:54:47</text>

  <!-- Clip 3 - Normal -->
  <rect x="136" y="164" width="48" height="32" rx="6" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.18)" stroke-width="1"/>
  <rect x="136" y="164" width="48" height="20" rx="6" fill="rgba(10,15,30,0.7)"/>
  <rect x="136" y="177" width="48" height="7" fill="rgba(10,15,30,0.7)"/>
  <text x="146" y="175" font-family="sans-serif" font-size="6" fill="rgba(14,206,206,0.7)">● TRIP</text>
  <text x="140" y="190" font-family="monospace" font-size="5.5" fill="rgba(255,255,255,0.4)">07:30:00</text>

  <!-- Storage bar -->
  <rect x="16" y="208" width="168" height="34" rx="8" fill="rgba(14,206,206,0.04)" stroke="rgba(14,206,206,0.12)" stroke-width="1"/>
  <text x="24" y="221" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.55)" letter-spacing="1">CLOUD STORAGE</text>
  <rect x="24" y="226" width="128" height="6" rx="3" fill="rgba(14,206,206,0.1)"/>
  <rect x="24" y="226" width="86" height="6" rx="3" fill="url(#storageGrad)"/>
  <text x="157" y="232" font-family="monospace" font-size="7" fill="rgba(14,206,206,0.7)">67%</text>

  <!-- AI detection label -->
  <rect x="16" y="252" width="168" height="20" rx="6" fill="rgba(14,206,206,0.06)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="30" y="266" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.7)" letter-spacing="0.5">AI Event Detection  ·  4 cameras  ·  30fps</text>

  <defs>
    <linearGradient id="camBg" x1="0" y1="0" x2="200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="#5DECEC"/>
    </linearGradient>
  </defs>
</svg>
