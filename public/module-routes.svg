<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="280" fill="#060E1A"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="200" x2="200" y2="200" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="0" y1="240" x2="200" y2="240" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="280" stroke="rgba(14,206,206,0.06)" stroke-width="1"/>
  <!-- Header -->
  <rect x="0" y="0" width="200" height="32" fill="rgba(14,206,206,0.08)"/>
  <circle cx="12" cy="16" r="4" fill="#0ECECE" opacity="0.7"/>
  <rect x="20" y="12" width="68" height="8" rx="2" fill="rgba(14,206,206,0.4)"/>
  <rect x="144" y="9" width="44" height="14" rx="3" fill="rgba(14,206,206,0.12)" stroke="rgba(14,206,206,0.3)" stroke-width="1"/>
  <text x="150" y="20" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.8)">14 trips</text>
  <!-- Route timeline -->
  <rect x="8" y="40" width="184" height="76" rx="8" fill="rgba(4,9,26,0.6)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <!-- Trip A line -->
  <line x1="28" y1="64" x2="28" y2="104" stroke="rgba(14,206,206,0.3)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="28" cy="60" r="5" fill="#0ECECE"/>
  <circle cx="28" cy="108" r="5" fill="rgba(14,206,206,0.4)" stroke="#0ECECE" stroke-width="1.5"/>
  <text x="38" y="64" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.8)" font-weight="600">Depot A  →  Site B</text>
  <text x="38" y="76" font-family="monospace" font-size="7" fill="rgba(14,206,206,0.6)">06:14  →  08:42  ·  128 km</text>
  <!-- stop marker -->
  <rect x="38" y="84" width="40" height="12" rx="3" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
  <text x="43" y="93" font-family="sans-serif" font-size="6" fill="#F59E0B">⏱ 18 min stop</text>
  <text x="38" y="112" font-family="monospace" font-size="7" fill="rgba(14,206,206,0.6)">09:00  →  11:15  ·  96 km</text>
  <!-- Distance chart bars -->
  <rect x="8" y="126" width="184" height="66" rx="8" fill="rgba(4,9,26,0.5)" stroke="rgba(14,206,206,0.12)" stroke-width="1"/>
  <text x="16" y="139" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)" letter-spacing="1">DISTANCE / TRIP (KM)</text>
  <!-- Bars -->
  <rect x="18" y="148" width="14" height="32" rx="2" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="38" y="155" width="14" height="25" rx="2" fill="url(#barGrad)" opacity="0.6"/>
  <rect x="58" y="144" width="14" height="36" rx="2" fill="url(#barGrad)" opacity="0.8"/>
  <rect x="78" y="160" width="14" height="20" rx="2" fill="url(#barGrad)" opacity="0.55"/>
  <rect x="98" y="150" width="14" height="30" rx="2" fill="url(#barGrad)" opacity="0.75"/>
  <rect x="118" y="142" width="14" height="38" rx="2" fill="url(#barGrad)"/>
  <rect x="138" y="153" width="14" height="27" rx="2" fill="url(#barGrad)" opacity="0.65"/>
  <rect x="158" y="146" width="14" height="34" rx="2" fill="url(#barGrad)" opacity="0.85"/>
  <line x1="8" y1="180" x2="192" y2="180" stroke="rgba(14,206,206,0.1)" stroke-width="1"/>
  <!-- Trip list cards -->
  <rect x="8" y="200" width="90" height="34" rx="6" fill="rgba(14,206,206,0.05)" stroke="rgba(14,206,206,0.15)" stroke-width="1"/>
  <text x="16" y="213" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.6)">Avg distance</text>
  <text x="16" y="226" font-family="monospace" font-size="13" font-weight="700" fill="#0ECECE">112 km</text>

  <rect x="106" y="200" width="86" height="34" rx="6" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
  <text x="114" y="213" font-family="sans-serif" font-size="7" fill="rgba(34,197,94,0.6)">On-time rate</text>
  <text x="114" y="226" font-family="monospace" font-size="13" font-weight="700" fill="#22C55E">94.2%</text>

  <rect x="8" y="242" width="184" height="30" rx="6" fill="rgba(14,206,206,0.04)" stroke="rgba(14,206,206,0.1)" stroke-width="1"/>
  <text x="16" y="255" font-family="sans-serif" font-size="7" fill="rgba(14,206,206,0.5)" letter-spacing="0.5">Total trips today: 14  ·  3,920 km  ·  Replay available</text>
  <text x="16" y="267" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.3)">All routes archived  ·  90-day history</text>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ECECE"/>
      <stop offset="100%" stop-color="rgba(14,206,206,0.3)"/>
    </linearGradient>
  </defs>
</svg>
